<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Buddy</title>
<style>
  :root {
    --bg: #f5f6fb; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --accent: #4f46e5; --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font: inherit; background: #fff; color: inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 220px; }
  button {
    background: var(--accent); color: #fff; border: 0; padding: 11px 20px;
    border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #output { white-space: pre-wrap; word-wrap: break-word; min-height: 60px; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .error { color: #b91c1c; }
  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 AI Study Buddy</h1>
  <p class="sub">Paste any topic, notes, or code — pick a mode — let AI help you learn faster.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="apiKey">Gemini API key</label>
        <input id="apiKey" type="password" placeholder="Paste your key (stored only in your browser)">
        <div class="hint">Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>.</div>
      </div>
      <div>
        <label for="model">Model</label>
        <input id="model" value="gemini-2.5-flash">
        <div class="hint">Change if Google renames/retires the model.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label for="mode">What do you want to do?</label>
    <select id="mode">
      <option value="explain">🧒 Explain it simply</option>
      <option value="summary">📝 Summarize into key points</option>
      <option value="quiz">❓ Make a 5-question quiz</option>
      <option value="code">💻 Explain / debug my code</option>
      <option value="plan">🗓️ Create a 3-day study plan</option>
    </select>

    <label for="input" style="margin-top:14px">Your topic, notes, or code</label>
    <textarea id="input" placeholder="e.g. Explain how HTTP requests work"></textarea>

    <div class="actions">
      <button id="go">Ask AI</button>
      <button id="copy" class="ghost">Copy answer</button>
      <button id="clear" class="ghost">Clear</button>
    </div>
  </div>

  <div class="card">
    <label>Answer</label>
    <div id="output">Your answer will appear here.</div>
  </div>
</div>

<script>
const PROMPTS = {
  explain: "Explain the following in simple language for a beginner. Use a short analogy and one example:\n\n",
  summary: "Summarize the following into clear bullet-point key takeaways (max 8 bullets):\n\n",
  quiz:    "Create a 5-question multiple-choice quiz (4 options each) on the following. Put the answer key at the end:\n\n",
  code:    "You are a friendly coding mentor. Explain what this code does, point out bugs or improvements, and show a corrected version if needed:\n\n",
  plan:    "Create a realistic 3-day study plan (with time blocks and practice tasks) for learning:\n\n"
};

const $ = id => document.getElementById(id);
const keyBox = $("apiKey"), modelBox = $("model"), out = $("output"), goBtn = $("go");

// Restore saved settings
try {
  keyBox.value = localStorage.getItem("gemini_key") || "";
  modelBox.value = localStorage.getItem("gemini_model") || modelBox.value;
} catch (e) {}

async function askAI() {
  const key = keyBox.value.trim();
  const text = $("input").value.trim();
  const model = modelBox.value.trim() || "gemini-2.5-flash";

  if (!key) { out.innerHTML = '<span class="error">Please paste your Gemini API key first.</span>'; return; }
  if (!text) { out.innerHTML = '<span class="error">Please enter a topic, notes, or code.</span>'; return; }

  try {
    localStorage.setItem("gemini_key", key);
    localStorage.setItem("gemini_model", model);
  } catch (e) {}

  goBtn.disabled = true;
  out.textContent = "Thinking…";

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: PROMPTS[$("mode").value] + text }] }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `Request failed (${res.status})`);
    const answer = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "No answer returned.";
    out.textContent = answer;
  } catch (err) {
    out.innerHTML = '<span class="error"></span>';
    out.firstChild.textContent = "Error: " + err.message;
  } finally {
    goBtn.disabled = false;
  }
}

goBtn.addEventListener("click", askAI);
$("copy").addEventListener("click", () => navigator.clipboard.writeText(out.textContent));
$("clear").addEventListener("click", () => { $("input").value = ""; out.textContent = "Your answer will appear here."; });
$("input").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") askAI(); });
</script>
</body>
</html>
